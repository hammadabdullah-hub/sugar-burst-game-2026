async function clearSet(set,spawn,combo){const sk=new Set(spawn.map(s=>s.cell[0]*N+s.cell[1]));sk.forEach(k=>set.delete(k));const q=[...set.values()],seen=new Set(set.keys());

 if(combo>1){say(['','','Sweet!','Tasty!','Delicious!','Divine!','Sugar Rush!','Unreal!','Legendary!'][Math.min(combo,8)]);if(combo>=4){try{B.animate([{filter:'brightness(1.6)'},{filter:'brightness(1)'}],350)}catch(e){}if(!Quests.st().combo)Quests.add('combo',1)}}
 hud();await sleep(240);gravity();await sleep(260)}
async function resolve(pref){let combo=1;for(;;){const R=runs();if(!R.length)break;const set=new Map(),spawn=[];
 const hs=new Set(),vs=new Set();for(const run of R)for(const[r,c]of run.cells)(run.h?hs:vs).add(r*N+c);for(const k of hs)if(vs.has(k)){const r=k>>3,c=k&7;if(g[r][c].s==0&&!g[r][c].k)spawn.push({cell:[r,c],t:g[r][c].t,s:4})}

async function trySwap(a,b){if(busy||moves<=0)return;busy=true;clearHint();const A=g[a[0]][a[1]],Bt=g[b[0]][b[1]];if(A.k>0||Bt.k>0){busy=false;say('Locked!');return}sw(a,b);snd(300,.08);await sleep(210);

 if(A.s==3||Bt.s==3){moves--;if(A.s&&Bt.s)combos++;const oth=A.s==3?Bt:A,col=(A.s==3&&Bt.s==3)?-2:oth.t,set=new Map();for(let r=0;r<N;r++)for(let c=0;c<N;c++){const o=g[r][c];if(o&&(col==-2||o.s==3||o.t===col)){set.set(r*N+c,[r,c]);if(col!=-2&&o.s!=3&&spc(oth)){o.s=oth.s==4?4:1+((r+c)&1);paint(o)}}}hud();await clearSet(set,[],3);await resolve(null)}
 else if(spc(A)&&spc(Bt)){moves--;combos++;const[br,bc]=b,set=new Map(),add=(x,y)=>{if(x>=0&&y>=0&&x<N&&y<N)set.set(x*N+y,[x,y])},w=(A.s==4&&Bt.s==4)?2:(A.s==4||Bt.s==4)?1:0;A.s=0;Bt.s=0;if(w==2){for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)add(br+i,bc+j)}else{for(let x=0;x<N;x++){if(w){for(let d=-1;d<=1;d++){add(br+d,x);add(x,bc+d)}}else{add(br,x);add(x,bc)}}}hud();await clearSet(set,[],3);await resolve(null)}

function hasMove(){return !!findMove()}
function findMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[dr,dc]of[[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(r2>=N||c2>=N)continue;const A=g[r][c],Bt=g[r2][c2];if(A.k>0||Bt.k>0)continue;if(A.s==3||Bt.s==3)return[[r,c],[r2,c2]];g[r][c]=Bt;g[r2][c2]=A;const ok=runs().length>0;g[r][c]=A;g[r2][c2]=Bt;if(ok)return[[r,c],[r2,c2]]}return null}
